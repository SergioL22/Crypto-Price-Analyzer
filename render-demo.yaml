# Deploy as a NEW Blueprint with Blueprint Path render-demo.yaml.
# This does not update or replace the private live-data service.
services:
  - type: web
    name: research-desk-demo
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PUBLIC_MARKET_WIDGETS
        value: "1"
      - key: PUBLIC_SEC_RESEARCH
        value: "1"
      # Optional: app name and contact email for live SEC filing checks, e.g. ResearchDesk/1.0 (you@example.com).
      # Without it, filing alerts use the committed snapshot.
      - key: SEC_USER_AGENT
        sync: false
