name: Refresh SEC snapshot

# Rebuilds sec_data/research_snapshot.json from SEC EDGAR once a month and
# commits it when it changed. Requires the SEC_USER_AGENT repository secret
# (app name and contact email, e.g. "ResearchDesk/1.0 (you@example.com)").
on:
  schedule:
    - cron: '17 9 3 * *'   # 09:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-backend-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-backend-dev.txt
      - name: Check the secret is set
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: test -n "$SEC_USER_AGENT" || { echo '::error::Add the SEC_USER_AGENT repository secret first.'; exit 1; }
      - name: Rebuild snapshot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_refresh.py
      - name: Validate snapshot
        run: python -m pytest tests/test_sec_research.py tests/test_public_market.py tests/test_public_demo.py -q
      - name: Commit if changed
        run: |
          if git diff --quiet -- sec_data/research_snapshot.json; then echo 'Snapshot unchanged.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sec_data/research_snapshot.json
          git commit -m "Refresh SEC research snapshot ($(date -u +%Y-%m-%d))"
          git push
