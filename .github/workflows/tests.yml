name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      OPENAI_API_KEY: ''
      OPENAI_MODEL: ''
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-backend.txt
            requirements-backend-dev.txt
      - name: Install CLI and backend test dependencies
        run: python -m pip install -r requirements.txt -r requirements-backend-dev.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Verify backend tests cannot skip for missing dependencies
        run: python -c "import fastapi, httpx; from fastapi.testclient import TestClient; from backend import create_app; create_app()"
      - name: Run full offline test suite
        run: python -m pytest tests -q -ra --strict-markers --strict-config
