name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline dashboard interaction tests
        run: node --test tests/dashboard.test.cjs
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      OPENAI_API_KEY: ''
      OPENAI_MODEL: ''
      TWELVE_DATA_API_KEY: ''
      FINNHUB_API_KEY: ''
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-backend.txt
            requirements-backend-dev.txt
            requirements-accounts.txt
      - name: Install CLI and backend test dependencies
        run: python -m pip install -r requirements.txt -r requirements-backend-dev.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Verify backend tests cannot skip for missing dependencies
        run: python -c "import fastapi, httpx, account_backend, account_auth; from fastapi.testclient import TestClient; from backend import create_app; create_app()"
      - name: Run full offline test suite
        run: python -m pytest tests -q -ra --strict-markers --strict-config

  hosted-container:
    name: Hosted preview / container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build secret-free hosted image
        run: docker build -t research-preview:test .
      - name: Verify runtime startup and access boundary
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name research-preview -p 127.0.0.1:10000:10000 -e HOSTED_ORIGIN=https://preview.example -e HOSTED_PREVIEW_PASSWORD=synthetic-container-test-password-only research-preview:test
          trap 'docker rm -f research-preview >/dev/null' EXIT
          curl --retry 12 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:10000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: preview.example' -H 'X-Forwarded-Proto: https' http://127.0.0.1:10000/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u preview:synthetic-container-test-password-only -H 'Host: preview.example' -H 'X-Forwarded-Proto: https' http://127.0.0.1:10000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -u preview:synthetic-container-test-password-only -H 'Host: preview.example' -H 'X-Forwarded-Proto: https' http://127.0.0.1:10000/v1/holdings)" = 404
